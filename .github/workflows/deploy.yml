name: Deploy

# Envoi sur main → contrôles (ci.yml) → image → VPS, sans intervention ni coupure.
# Désactivé tant que la variable DEPLOY_ENABLED de l’environnement « production » ne vaut pas
# « true » (docs/deployment.md) : avant cela, seuls les contrôles tournent.
on:
  push:
    branches: [main]
  workflow_dispatch: # relancer un déploiement (ex. après un changement de variable)

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Les variables d'un environnement ne sont lisibles qu'à l'intérieur d'une tâche qui le
  # déclare, pas dans le `if` d'une tâche : on lit donc DEPLOY_ENABLED ici.
  gate:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ vars.DEPLOY_ENABLED == 'true' }}" >> "$GITHUB_OUTPUT"

  image:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: name # GHCR exige des minuscules
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fichiers du serveur (configuration, scripts, migrations, modèles d'emails)
        run: |
          mkdir -p bundle/supabase
          cp -r deploy bundle/
          cp -r supabase/migrations supabase/templates bundle/supabase/
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: bundle
          strip_components: 1
          target: /srv/saasclair
      # Migrations (avec sauvegarde préalable), démarrage de la nouvelle version, contrôle de
      # santé, bascule. En cas d'échec, la version en service ne bouge pas.
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: bash /srv/saasclair/deploy/scripts/deploy.sh "$IMAGE"
      - name: Vérification depuis Internet
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/health?complet=1" && exit 0
            sleep 5
          done
          exit 1
