# SaasClair — rendu par deploy/scripts/render-nginx.sh (les valeurs __X__ viennent du .env).
# Fichier autonome : il ne modifie aucun autre site du serveur. Les noms de zones et d'upstreams
# sont préfixés « saasclair_ » pour ne jamais entrer en conflit avec les autres configurations.
# Certbot ajoute ensuite le HTTPS (listen 443, certificats, redirection) dans ces mêmes blocs.

limit_req_zone $binary_remote_addr zone=saasclair_site:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=saasclair_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=saasclair_auth:10m rate=5r/s;

# Couleur de l'application en service : fichier écrit par deploy.sh à chaque bascule, suivi d'un
# rechargement en douceur de Nginx (les requêtes en cours se terminent sur l'ancienne version).
upstream saasclair_web {
  include __ROOT__/nginx/upstream.conf;
  keepalive 16;
  # Plus court que celui de Next.js (5 s) : sinon Node ferme une connexion que Nginx réutilise.
  keepalive_timeout 4s;
}

server {
  listen 80;
  server_name www.__DOMAIN__;
  return 301 $scheme://__DOMAIN__$request_uri;
}

server {
  listen 80;
  server_name __DOMAIN__;
  client_max_body_size 5m;
  # Les cookies de session Supabase (découpés en plusieurs morceaux) dépassent les 4 à 8 Ko par
  # défaut des en-têtes : sans ceci, inscription et connexion échouent en 502.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;

  location / {
    limit_req zone=saasclair_site burst=60 nodelay;
    proxy_pass http://saasclair_web;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }
}

# API Supabase : mêmes chemins que Supabase Cloud, donc aucun changement dans le code.
server {
  listen 80;
  server_name __API_DOMAIN__;
  client_max_body_size 2m;
  # Les cookies de session Supabase (découpés en plusieurs morceaux) dépassent les 4 à 8 Ko par
  # défaut des en-têtes : sans ceci, inscription et connexion échouent en 502.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;

  # Connexion, inscription, mot de passe : débit plus strict contre les essais en rafale.
  location ~ ^/auth/v1/(token|signup|recover|otp|verify) {
    limit_req zone=saasclair_auth burst=10 nodelay;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://__UPSTREAM_HOST__:__AUTH_PORT__;
  }

  location /auth/v1/ {
    limit_req zone=saasclair_api burst=60 nodelay;
    proxy_pass http://__UPSTREAM_HOST__:__AUTH_PORT__/;
  }

  location /rest/v1/ {
    limit_req zone=saasclair_api burst=60 nodelay;
    proxy_pass http://__UPSTREAM_HOST__:__REST_PORT__/;
  }

  # Modèles d'emails lus par le service Auth (aucune donnée personnelle).
  location /modeles-email/ {
    alias __ROOT__/supabase/templates/;
    default_type text/html;
  }

  location / {
    return 404;
  }
}
